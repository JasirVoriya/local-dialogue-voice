[project]
name = "local-dialogue-voice"
version = "0.1.0"
description = "本机台词配音工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "qwen-tts>=0.1.1,<1",
  "modelscope>=1.30,<2",
]

# Run engineering checks without downloading torch or model weights:
# uv sync --locked --only-group test
[dependency-groups]
test = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
