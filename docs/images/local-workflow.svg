<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">本机台词配音处理流程</title>
  <desc id="desc">本地视频依次经过转写对齐、声音和语气参考、分句生成，最终导出 MP3。视频和音频不上传。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faf7"/><stop offset="1" stop-color="#edf4ef"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75a58a"/></marker>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <text x="48" y="62" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#183d2c">从参考视频到台词 MP3</text>
  <text x="48" y="94" font-family="Arial, sans-serif" font-size="16" fill="#64766b">视频、声音和转写内容都在这台 Mac 上处理</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(42 130)"><rect width="245" height="174" rx="18" fill="#fff" stroke="#d9e5dc"/><circle cx="34" cy="34" r="18" fill="#e4f1e8"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1b6845">1</text><rect x="24" y="65" width="52" height="39" rx="8" fill="#1c3328"/><path d="M45 75v19l15-9.5Z" fill="#fff"/><text x="24" y="132" font-size="19" font-weight="700" fill="#26372c">选择参考视频</text><text x="24" y="155" font-size="13" fill="#748078">预览画面并导入原声</text></g>
    <path d="M298 216h27" stroke="#75a58a" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(337 130)"><rect width="245" height="174" rx="18" fill="#fff" stroke="#d9e5dc"/><circle cx="34" cy="34" r="18" fill="#e4f1e8"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1b6845">2</text><path d="M25 92h12l10-18 12 34 12-25 10 16h13" fill="none" stroke="#238259" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="132" font-size="19" font-weight="700" fill="#26372c">转写与时间对齐</text><text x="24" y="155" font-size="13" fill="#748078">校正原声文字，定位每句</text></g>
    <path d="M593 216h27" stroke="#75a58a" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(632 130)"><rect width="245" height="174" rx="18" fill="#fff" stroke="#d9e5dc"/><circle cx="34" cy="34" r="18" fill="#e4f1e8"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1b6845">3</text><rect x="24" y="73" width="166" height="18" rx="9" fill="#e7eee9"/><rect x="75" y="73" width="74" height="18" rx="9" fill="#4a9a6d"/><rect x="70" y="69" width="8" height="26" rx="4" fill="#176542"/><rect x="145" y="69" width="8" height="26" rx="4" fill="#176542"/><text x="24" y="132" font-size="19" font-weight="700" fill="#26372c">选择声音参考</text><text x="24" y="155" font-size="13" fill="#748078">整段保音色，选句学语气</text></g>
    <path d="M888 216h27" stroke="#75a58a" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(927 130)"><rect width="231" height="174" rx="18" fill="#fff" stroke="#d9e5dc"/><circle cx="34" cy="34" r="18" fill="#e4f1e8"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1b6845">4</text><circle cx="47" cy="85" r="23" fill="#e5f2e9"/><path d="M43 73v24l19-12Z" fill="#21764e"/><path d="M88 78h106M88 90h82" stroke="#92ab9a" stroke-width="5" stroke-linecap="round"/><text x="24" y="132" font-size="19" font-weight="700" fill="#26372c">逐句生成并导出</text><text x="24" y="155" font-size="13" fill="#748078">试听、重做，再保存 MP3</text></g>
  </g>
  <rect x="42" y="329" width="1116" height="42" rx="12" fill="#e3f1e8"/><circle cx="67" cy="350" r="8" fill="#258052"/><text x="86" y="356" font-family="Arial, sans-serif" font-size="15" fill="#28543b">仅首次安装依赖和下载模型需要联网；视频与音频不会上传。</text>
</svg>
