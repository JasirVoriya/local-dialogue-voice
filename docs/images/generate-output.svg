<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">逐句生成与试听界面示意</title>
  <desc id="desc">每行输入一句，空行增加停顿；生成后试听单句、重做单句或下载完整 MP3。</desc>
  <rect width="1120" height="760" rx="24" fill="#f3f6f3"/><rect x="28" y="24" width="1064" height="712" rx="20" fill="#fff" stroke="#dfe7e1"/>
  <g font-family="Arial, sans-serif">
    <circle cx="67" cy="67" r="20" fill="#256c4a"/><text x="67" y="74" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4</text><text x="102" y="74" font-size="26" font-weight="700" fill="#20382a">输入台词，逐句试听</text><text x="1035" y="72" text-anchor="end" font-size="15" fill="#78857b">每行一句；空行会加长停顿</text>
    <rect x="56" y="108" width="1008" height="174" rx="14" fill="#fbfcfb" stroke="#dce5de"/><text x="78" y="140" font-size="15" fill="#35463b">路边的灯已经亮了。</text><text x="78" y="177" font-size="15" fill="#9aa69e">（这里留一个空行，下一句之间会多停顿）</text><text x="78" y="218" font-size="15" fill="#35463b">我们明天再出发。</text><text x="78" y="260" font-size="13" fill="#89958c">可保留逗号、句号、省略号等标点来表达语气。</text>
    <rect x="56" y="301" width="202" height="48" rx="11" fill="#176344"/><text x="157" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">生成完整音频</text>
    <rect x="56" y="373" width="1008" height="122" rx="14" fill="#fbfcfb" stroke="#dce5de"/><text x="78" y="401" font-size="13" font-weight="700" fill="#7d8a81">01</text><rect x="116" y="385" width="678" height="40" rx="9" fill="#fff" stroke="#dce5de"/><text x="132" y="411" font-size="15" fill="#35463b">路边的灯已经亮了。</text><rect x="815" y="385" width="224" height="40" rx="9" fill="#f4f9f5" stroke="#cfe0d3"/><text x="927" y="411" text-anchor="middle" font-size="14" font-weight="700" fill="#216a48">单独重做</text><circle cx="93" cy="464" r="17" fill="#e5f2e9"/><path d="M89 454v20l15-10Z" fill="#21764e"/><rect x="124" y="459" width="880" height="8" rx="4" fill="#e0e8e2"/><rect x="124" y="459" width="355" height="8" rx="4" fill="#73a985"/>
    <rect x="56" y="510" width="1008" height="122" rx="14" fill="#fbfcfb" stroke="#dce5de"/><text x="78" y="538" font-size="13" font-weight="700" fill="#7d8a81">02</text><rect x="116" y="522" width="678" height="40" rx="9" fill="#fff" stroke="#dce5de"/><text x="132" y="548" font-size="15" fill="#35463b">我们明天再出发。</text><rect x="815" y="522" width="224" height="40" rx="9" fill="#f4f9f5" stroke="#cfe0d3"/><text x="927" y="548" text-anchor="middle" font-size="14" font-weight="700" fill="#216a48">单独重做</text><circle cx="93" cy="601" r="17" fill="#e5f2e9"/><path d="M89 591v20l15-10Z" fill="#21764e"/><rect x="124" y="596" width="880" height="8" rx="4" fill="#e0e8e2"/><rect x="124" y="596" width="520" height="8" rx="4" fill="#73a985"/>
    <rect x="56" y="650" width="1008" height="62" rx="13" fill="#eaf4ed"/><circle cx="91" cy="681" r="17" fill="#d5eadb"/><path d="M87 671v20l15-10Z" fill="#21764e"/><text x="122" y="677" font-size="15" font-weight="700" fill="#315741">完整 MP3 试听</text><text x="122" y="699" font-size="13" fill="#6c7d71">确认后点击“下载 MP3”；单独重做只替换当前句。</text><rect x="844" y="665" width="194" height="34" rx="9" fill="#fff" stroke="#cfe0d3"/><text x="941" y="687" text-anchor="middle" font-size="14" font-weight="700" fill="#216a48">下载 MP3</text>
  </g>
</svg>
